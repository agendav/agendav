<div class="navbar navbar-default" role="navigation">
  <div class="container-fluid">
    <div class="navbar-header">
      <span class="navbar-brand">{{ title }}</span>
    </div>
    <p class="navbar-text navbar-right" id="loading">
      <img src="{{ asset('loading.gif', 'img') }}" alt="">
    </p>
    <ul class="nav navbar-nav navbar-right" id="usermenu">
        {% if not autologin_hide_preferences %}
        <li>
        <a class="prefs" href="{{ url_for('preferences') }}">
          <i title="{% trans %}labels.preferences{% endtrans %}" class="fa fa-lg fa-wrench"></i>
        </a>
        </li>
        {% endif %}
        {% if not autologin_read_only %}
        <li>
        <a class="logout" href="{{ url_for('logout') }}">
          <i title="{% trans %}labels.logout{% endtrans %}" class="fa fa-lg fa-power-off"></i>
        </a>
        </li>
        {% endif %}
        <li><a href="javascript:void(0)">
        {{ displayname }}
        </a>
        </li>
    </ul>
  </div>
</div>
